apiVersion: apps/v1
kind: Deployment
metadata:
  name: werrss
  labels:
    app.kubernetes.io/name: werrss
    app.kubernetes.io/part-of: werrss
    app.kubernetes.io/component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: werrss
      app.kubernetes.io/part-of: werrss
  template:
    metadata:
      labels:
        app.kubernetes.io/name: werrss
        app.kubernetes.io/part-of: werrss
        app.kubernetes.io/component: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: firefox-shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
      containers:
        - name: werrss
          image: ghcr.io/alex222222222222/werrss:v0.1.9
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          env:
            - name: APP_ROLES
              value: api
            - name: HTTP_BIND
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "8080"
            - name: WEBDRIVER_URL
              value: http://127.0.0.1:4444
            - name: BROWSER_ENGINE
              value: firefox
          envFrom:
            - secretRef:
                name: werrss-runtime
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              scheme: HTTP
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: firefox
          image: ghcr.io/seleniumhq/standalone-firefox:4.42.0-20260303
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: webdriver
              containerPort: 4444
              protocol: TCP
          volumeMounts:
            - name: firefox-shm
              mountPath: /dev/shm
          readinessProbe:
            httpGet:
              path: /status
              port: webdriver
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /status
              port: webdriver
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: werrss
  labels:
    app.kubernetes.io/name: werrss
    app.kubernetes.io/part-of: werrss
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: werrss
    app.kubernetes.io/part-of: werrss
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
